<section class="rating-page">
  <div class="rating-card">
    <div class="rating-header">
      <span>Calificación</span>
      <h1>Calificar servicio</h1>
      <p>
        Comparte tu experiencia sobre el servicio recibido. Tu opinión ayuda a mejorar
        la atención y calidad de Mary Nails.
      </p>
    </div>

    <form class="rating-form">
      <div class="form-group">
        <label>Servicio realizado</label>
        <select>
          <option>Selecciona el servicio</option>
          <option>Manicure profesional</option>
          <option>Pedicure</option>
          <option>Uñas acrílicas</option>
          <option>Diseño personalizado</option>
        </select>
      </div>

      <div class="form-group">
        <label>Puntuación</label>
        <div class="stars">
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>★</span>
        </div>
      </div>

      <div class="form-group">
        <label>Comentario</label>
        <textarea placeholder="Escribe tu opinión sobre el servicio recibido"></textarea>
      </div>

      <button type="button" class="btn-rating">Enviar calificación</button>
    </form>
  </div>
</section>
