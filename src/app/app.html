<app-navbar *ngIf="!adminLogueado"></app-navbar>

<div class="admin-layout" *ngIf="adminLogueado">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">Mary Nails Web</span>
      <small>Panel administrativo</small>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section">Dashboard</span>
      <a routerLink="/admin/dashboard" routerLinkActive="active">📊 Resumen</a>

      <span class="nav-section">Gestión</span>
      <a routerLink="/admin/cronograma" routerLinkActive="active">📅 Citas</a>
      <a routerLink="/admin/clientes" routerLinkActive="active">👥 Clientes</a>
      <a routerLink="/admin/servicios" routerLinkActive="active">💅 Servicios</a>

      <span class="nav-section">Configuración</span>
      <a routerLink="/admin/disponibilidad" routerLinkActive="active">🕐 Disponibilidad</a>
      <a routerLink="/admin/pagos" routerLinkActive="active">💰 Pagos</a>
      <a routerLink="/admin/calificaciones" routerLinkActive="active">⭐ Calificaciones</a>
      <a routerLink="/admin/reportes" routerLinkActive="active">📈 Reportes</a>
    </nav>

    <button type="button" class="sidebar-logout" (click)="cerrarSesionAdmin()">Cerrar sesión</button>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>

<router-outlet *ngIf="!adminLogueado"></router-outlet>
