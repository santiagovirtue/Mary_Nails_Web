<section class="admin-login-page">
  <div class="login-card">
    <div class="login-header">
      <span>Administrador</span>
      <h1>Ingreso al panel</h1>
      <p>
        Accede al panel administrativo para gestionar citas, horarios,
        servicios y disponibilidad de Mary Nails.
      </p>
    </div>

    <form class="login-form">
      <div class="form-group">
        <label>Correo o usuario</label>
        <input type="text" placeholder="Ej: admin@marynails.com" />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" placeholder="Ingresa tu contraseña" />
      </div>

      <a routerLink="/admin/dashboard" class="btn-login">Ingresar</a>
    </form>

    <div class="login-footer">
      <p>Acceso exclusivo para personal autorizado.</p>
    </div>
  </div>
</section>
