<section class="login-admin-page">
  <div class="login-admin-card">
    <span class="login-badge">Administrador</span>

    <h1>Ingreso al panel</h1>

    <p>
      Accede al panel administrativo para gestionar citas, horarios,
      servicios y disponibilidad de Mary Nails.
    </p>

    <div>
      <div class="form-group">
        <label>Correo o usuario</label>
        <input
          type="text"
          name="usuario"
          placeholder="Ej: admin@marynails.com"
          [(ngModel)]="usuario"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          type="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          [(ngModel)]="password"
        />
      </div>

      <button type="button" class="btn-login" (click)="iniciarSesion()" [disabled]="cargando">
        {{ cargando ? "Verificando..." : "Ingresar" }}
      </button>

      <p class="error-message" *ngIf="mensajeError">
        {{ mensajeError }}
      </p>
    </div>

    <p class="admin-note">
      Acceso exclusivo para personal autorizado.
    </p>
  </div>
</section>
