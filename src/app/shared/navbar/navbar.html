<header class="navbar">
  <a routerLink="/" class="logo">Mary Nails</a>

  <nav class="nav-links">
    <a routerLink="/">Inicio</a>
    <a routerLink="/servicios">Servicios</a>
    <a routerLink="/galeria">Galería</a>
    <a routerLink="/reservas">Reservas</a>

    <!-- Opciones cuando no hay sesión iniciada -->
    <a routerLink="/login" *ngIf="sinSesion">
      Cliente
    </a>

    <a routerLink="/admin/login" class="admin-link" *ngIf="sinSesion">
      Admin
    </a>

    <!-- Opciones del cliente -->
    <a routerLink="/cliente/mis-citas" *ngIf="clienteLogueado">
      Cronograma cliente
    </a>

    <a routerLink="/cliente/calificar-servicio" *ngIf="clienteLogueado">
      Calificar servicio
    </a>

    <!-- Opciones del administrador -->
    <a routerLink="/admin/dashboard" *ngIf="adminLogueado">
      Dashboard
    </a>

    <a routerLink="/admin/cronograma" *ngIf="adminLogueado">
      Cronograma admin
    </a>

    <a routerLink="/admin/disponibilidad" *ngIf="adminLogueado">
      Disponibilidad
    </a>

    <a routerLink="/admin/servicios" *ngIf="adminLogueado">
      Gestionar servicios
    </a>

    <a routerLink="/admin/calificaciones" *ngIf="adminLogueado">
      Calificaciones
    </a>

    <a routerLink="/admin/pagos" *ngIf="adminLogueado">
      Pagos
    </a>

    <!-- Cerrar sesión -->
    <button
      type="button"
      class="logout-link"
      *ngIf="haySesionActiva"
      (click)="cerrarSesion()"
    >
      Cerrar sesión
    </button>
  </nav>
</header>
