<section class="login-page">
  <div class="login-card">
    <span class="login-badge">Cliente</span>

    <h1>Ingreso de cliente</h1>

    <p>
      Accede para consultar tus citas, revisar el estado de tus reservas
      y mantener actualizada tu información.
    </p>

    <form>
      <div class="form-group">
        <label>Correo o teléfono</label>
        <input
          type="text"
          name="usuario"
          placeholder="Ej: cliente@email.com"
          [(ngModel)]="usuario"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          type="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          [(ngModel)]="password"
        />
      </div>

      <button type="button" class="btn-login" (click)="iniciarSesion()">
        Ingresar
      </button>

      <p class="error-message" *ngIf="mensajeError">
        {{ mensajeError }}
      </p>
    </form>

    <div class="register-box">
      <h3>¿Aún no tienes cuenta?</h3>
      <p>Regístrate para consultar tus reservas y recibir confirmaciones.</p>

      <button type="button" class="btn-outline" (click)="crearCuenta()">
        Crear cuenta
      </button>
    </div>
  </div>
</section>
