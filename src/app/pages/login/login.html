<section class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>Mary Nails</h1>
      <p *ngIf="!modoRegistro">Inicia sesión con tu correo o teléfono</p>
      <p *ngIf="modoRegistro">Crea tu cuenta para reservar citas</p>
    </div>

    <div *ngIf="!modoRegistro" class="login-form">
      <div class="form-group">
        <label>Correo o teléfono</label>
        <input type="text" name="usuario" placeholder="Ej: maria@email.com o 3001234567" [(ngModel)]="usuario"/>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="Tu contraseña" [(ngModel)]="password" (keyup.enter)="iniciarSesion()"/>
      </div>
      <button type="button" class="btn-login" (click)="iniciarSesion()" [disabled]="cargando">
        {{ cargando ? 'Verificando...' : 'Iniciar sesión' }}
      </button>
    </div>

    <div *ngIf="modoRegistro" class="login-form">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" name="regNombre" placeholder="Ej: María González" [(ngModel)]="regNombre"/>
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="regCorreo" placeholder="Ej: maria@email.com" [(ngModel)]="regCorreo"/>
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" name="regTelefono" placeholder="Ej: 3001234567" [(ngModel)]="regTelefono"/>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="regPassword" placeholder="Crea una contraseña" [(ngModel)]="regPassword"/>
      </div>
      <button type="button" class="btn-login" (click)="crearCuenta()" [disabled]="cargando">
        {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </div>

    <p class="error-msg" *ngIf="mensajeError">{{ mensajeError }}</p>
    <p class="success-msg" *ngIf="mensajeExito">{{ mensajeExito }}</p>

    <div class="toggle-modo">
      <p *ngIf="!modoRegistro">¿No tienes cuenta? <button type="button" (click)="toggleModo()">Crear cuenta</button></p>
      <p *ngIf="modoRegistro">¿Ya tienes cuenta? <button type="button" (click)="toggleModo()">Iniciar sesión</button></p>
    </div>
  </div>
</section>
